<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Farm — Meu Perfil</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="app-layout">

        <div class="sidebar">

            <div class="sidebar-logo">
                <div class="logo-text">AURA</div>
                <div class="logo-sub">FARM</div>
            </div>

            <div class="nav">

                <div class="nav-section">
                    <div class="nav-label">Geral</div>
                    <a href="dashboard.html" class="nav-item">
                        <i class="ti ti-layout-dashboard"></i> Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Catálogo</div>
                    <a href="produtos.html" class="nav-item">
                        <i class="ti ti-shirt"></i> Produtos
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Vendas</div>
                    <a href="vendas.html" class="nav-item">
                        <i class="ti ti-shopping-cart"></i> Vendas
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Fornecedores</div>
                    <a href="fornecedores.html" class="nav-item">
                        <i class="ti ti-truck"></i> Fornecedores
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Funcionários</div>
                    <a href="funcionarios.html" class="nav-item">
                        <i class="ti ti-users"></i> Funcionários
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Conta</div>

                    <a href="perfil.html" class="nav-item active">
                        <i class="ti ti-user"></i> Meu Perfil
                    </a>

                    <a href="login.html" class="nav-item">
                        <i class="ti ti-logout"></i> Sair
                    </a>
                </div>

            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">AM</div>

                    <div>
                        <div class="user-name">Andrey Messias</div>
                        <div class="user-role">Administrador</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="main">

            <div class="topbar">
                <div class="page-title">MEU PERFIL</div>
                <div class="breadcrumb">Conta / Perfil</div>
            </div>

            <div class="content">

                <div class="form-card" style="max-width: 700px; margin: 0 auto;">

                    <div class="form-section-title">
                        DADOS PESSOAIS
                    </div>

                    <div class="field">
                        <label>Nome completo</label>
                        <input type="text" value="Andrey Messias" disabled>
                    </div>

                    <div class="row">

                        <div class="field">
                            <label>E-mail</label>
                            <input type="email" value="andrey@aura.com" disabled>
                        </div>

                        <div class="field">
                            <label>CPF</label>
                            <input type="text" value="123.456.789-00" disabled>
                        </div>

                    </div>

                    <div class="row">

                        <div class="field">
                            <label>Telefone</label>
                            <input type="text" value="(11) 99999-9999" disabled>
                        </div>

                        <div class="field">
                            <label>Cargo</label>
                            <input type="text" value="Gerente" disabled>
                        </div>

                    </div>

                    <div class="row">

                        <div class="field">
                            <label>Cidade</label>
                            <input type="text" value="São Paulo" disabled>
                        </div>

                        <div class="field">
                            <label>Estado</label>
                            <input type="text" value="SP" disabled>
                        </div>

                    </div>

                    <div class="field">
                        <label>País</label>
                        <input type="text" value="Brasil" disabled>
                    </div>

                    <div class="form-actions">
                        <a href="editar-perfil.html">
                            <button class="btn-dark">
                                EDITAR PERFIL
                            </button>
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

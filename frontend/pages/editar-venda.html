<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Farm — Editar Venda</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="app-layout">

        <div class="sidebar">

            <div class="sidebar-logo">
                <div class="logo-text">AURA</div>
                <div class="logo-sub">FARM</div>
            </div>

            <div class="nav">

                <div class="nav-section">
                    <div class="nav-label">Geral</div>

                    <a href="dashboard.html" class="nav-item">
                        <i class="ti ti-layout-dashboard"></i>
                        Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Catálogo</div>

                    <a href="produtos.html" class="nav-item">
                        <i class="ti ti-shirt"></i>
                        Produtos
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Vendas</div>

                    <a href="vendas.html" class="nav-item active">
                        <i class="ti ti-shopping-cart"></i>
                        Vendas
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Fornecedores</div>

                    <a href="fornecedores.html" class="nav-item">
                        <i class="ti ti-truck"></i>
                        Fornecedores
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Funcionários</div>

                    <a href="funcionarios.html" class="nav-item">
                        <i class="ti ti-users"></i>
                        Funcionários
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Conta</div>

                    <a href="perfil.html" class="nav-item">
                        <i class="ti ti-user"></i>
                        Meu Perfil
                    </a>

                    <a href="login.html" class="nav-item">
                        <i class="ti ti-logout"></i>
                        Sair
                    </a>
                </div>

            </div>

            <div class="sidebar-footer">

                <div class="user-info">
                    <div class="user-avatar">--</div>

                    <div>
                        <div class="user-name">--</div>
                        <div class="user-role">--</div>
                    </div>
                </div>

            </div>

        </div>

        <div class="main">

            <div class="topbar">

                <div class="page-title">
                    EDITAR VENDA
                </div>

                <div class="breadcrumb">
                    Vendas / Editar Venda
                </div>

            </div>

            <div class="content">

                <div id="erro-venda" class="form-error"></div>

                <div class="pedido-layout">

                    <div class="pedido-col">

                        <div class="form-card">

                            <div class="form-section-title">
                                PRODUTOS
                            </div>

                            <div id="lista-produtos-venda">
                                <p class="empty-state">Carregando produtos...</p>
                            </div>

                        </div>

                        <div class="form-card">

                            <div class="form-section-title">
                                ENDEREÇO DE ENTREGA
                            </div>

                            <div class="field">
                                <label>Rua</label>
                                <input type="text" id="venda-rua">
                            </div>

                            <div class="row">

                                <div class="field">
                                    <label>Número</label>
                                    <input type="text" id="venda-numero">
                                </div>

                                <div class="field">
                                    <label>Bairro</label>
                                    <input type="text" id="venda-bairro">
                                </div>

                            </div>

                            <div class="row">

                                <div class="field">
                                    <label>CEP (somente números)</label>
                                    <input type="text" id="venda-cep" maxlength="8">
                                </div>

                                <div class="field">
                                    <label>Complemento</label>
                                    <input type="text" id="venda-complemento">
                                </div>

                            </div>

                            <div class="row">

                                <div class="field">
                                    <label>Cidade</label>
                                    <input type="text" id="venda-cidade">
                                </div>

                                <div class="field">
                                    <label>Estado</label>
                                    <select id="venda-estado"></select>
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="pedido-aside">

                        <div class="summary-card">

                            <div class="summary-title">
                                RESUMO
                            </div>

                            <div id="resumo-itens-venda"></div>

                            <div class="summary-total">

                                <div class="summary-total-label">
                                    TOTAL
                                </div>

                                <div class="summary-total-val" id="resumo-total-venda">
                                    R$ 0,00
                                </div>

                            </div>

                            <button class="btn-confirm-white" id="btn-confirmar-venda">
                                SALVAR ALTERAÇÕES
                            </button>

                            <a href="vendas.html">
                                <button class="btn-cancel-ghost">
                                    CANCELAR
                                </button>
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/vendas.js"></script>

</body>

</html>

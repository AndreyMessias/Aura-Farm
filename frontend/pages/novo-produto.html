<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Farm — Novo Produto</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="app-layout">

        <div class="sidebar">

            <div class="sidebar-logo">
                <div class="logo-text">AURA</div>
                <div class="logo-sub">FARM</div>
            </div>

            <div class="nav">

                <div class="nav-section">
                    <div class="nav-label">Geral</div>

                    <a href="dashboard.html" class="nav-item">
                        <i class="ti ti-layout-dashboard"></i>
                        Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Catálogo</div>

                    <a href="produtos.html" class="nav-item active">
                        <i class="ti ti-shirt"></i>
                        Produtos
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Vendas</div>

                    <a href="vendas.html" class="nav-item">
                        <i class="ti ti-shopping-cart"></i>
                        Vendas
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Fornecedores</div>

                    <a href="fornecedores.html" class="nav-item">
                        <i class="ti ti-truck"></i>
                        Fornecedores
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Funcionários</div>

                    <a href="funcionarios.html" class="nav-item">
                        <i class="ti ti-users"></i>
                        Funcionários
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Conta</div>

                    <a href="perfil.html" class="nav-item">
                        <i class="ti ti-user"></i>
                        Meu Perfil
                    </a>

                    <a href="login.html" class="nav-item">
                        <i class="ti ti-logout"></i>
                        Sair
                    </a>
                </div>

            </div>

            <div class="sidebar-footer">
                <div class="user-info">

                    <div class="user-avatar">--</div>

                    <div>
                        <div class="user-name">--</div>
                        <div class="user-role">--</div>
                    </div>

                </div>
            </div>

        </div>

        <div class="main">

            <div class="topbar">
                <div class="page-title">
                    NOVO PRODUTO
                </div>

                <div class="breadcrumb">
                    Produtos / Novo
                </div>
            </div>

            <div class="content">

                <div class="form-card">

                    <div class="form-section-title">
                        INFORMAÇÕES DO PRODUTO
                    </div>

                    <div id="erro-produto" class="form-error"></div>

                    <div class="field">
                        <label>Código (11 caracteres)</label>
                        <input type="text" id="produto-codigo" maxlength="11" placeholder="Código único">
                    </div>

                    <div class="field">
                        <label>Nome do produto</label>
                        <input type="text" id="produto-nome">
                    </div>

                    <div class="field">
                        <label>Descrição</label>
                        <textarea rows="3" id="produto-descricao"></textarea>
                    </div>

                    <div class="row">

                        <div class="field">
                            <label>Tamanho</label>

                            <select id="produto-tamanho">
                                <option value="PP">PP</option>
                                <option value="P">P</option>
                                <option value="M">M</option>
                                <option value="G">G</option>
                                <option value="GG">GG</option>
                                <option value="UNICO">Único</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Cor</label>
                            <input type="text" id="produto-cor">
                        </div>

                    </div>

                    <div class="row">

                        <div class="field">
                            <label>Preço (R$)</label>
                            <input type="number" step="0.01" min="0.01" id="produto-preco">
                        </div>

                        <div class="field">
                            <label>Quantidade em estoque</label>
                            <input type="number" min="0" id="produto-estoque">
                        </div>

                    </div>

                    <div class="field">
                        <label>Fornecedor</label>

                        <select id="produto-fornecedor">
                            <option value="">Carregando fornecedores...</option>
                        </select>
                    </div>

                    <div class="form-actions">

                        <a href="produtos.html">
                            <button class="btn-outline">
                                CANCELAR
                            </button>
                        </a>

                        <button class="btn-dark" id="btn-salvar-produto">
                            SALVAR PRODUTO
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/produtos.js"></script>

</body>

</html>

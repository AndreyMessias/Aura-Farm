<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Farm — Novo Funcionário</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>

    <div class="app-layout">

        <div class="sidebar">

            <div class="sidebar-logo">
                <div class="logo-text">AURA</div>
                <div class="logo-sub">FARM</div>
            </div>

            <div class="nav">

                <div class="nav-section">
                    <div class="nav-label">Geral</div>

                    <a href="dashboard.html" class="nav-item">
                        <i class="ti ti-layout-dashboard"></i>
                        Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Catálogo</div>

                    <a href="produtos.html" class="nav-item">
                        <i class="ti ti-shirt"></i>
                        Produtos
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Vendas</div>

                    <a href="vendas.html" class="nav-item">
                        <i class="ti ti-shopping-cart"></i>
                        Vendas
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Fornecedores</div>

                    <a href="fornecedores.html" class="nav-item">
                        <i class="ti ti-truck"></i>
                        Fornecedores
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Funcionários</div>

                    <a href="funcionarios.html" class="nav-item active">
                        <i class="ti ti-users"></i>
                        Funcionários
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Conta</div>

                    <a href="perfil.html" class="nav-item">
                        <i class="ti ti-user"></i>
                        Meu Perfil
                    </a>

                    <a href="login.html" class="nav-item">
                        <i class="ti ti-logout"></i>
                        Sair
                    </a>
                </div>

            </div>

            <div class="sidebar-footer">

                <div class="user-info">

                    <div class="user-avatar">
                        AM
                    </div>

                    <div>
                        <div class="user-name">
                            Andrey Messias
                        </div>

                        <div class="user-role">
                            Administrador
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <div class="main">

            <div class="topbar">

                <div class="page-title">
                    NOVO FUNCIONÁRIO
                </div>

                <div class="breadcrumb">
                    Funcionários / Novo
                </div>

            </div>

            <div class="content">

                <div class="form-card" style="max-width: 700px;">

                    <div class="form-section-title">
                        DADOS PESSOAIS
                    </div>

                    <div class="field">
                        <label>Nome completo</label>
                        <input type="text">
                    </div>

                    <div class="row">

                        <div class="field">
                            <label>CPF</label>
                            <input type="text" placeholder="000.000.000-00">
                        </div>

                        <div class="field">
                            <label>E-mail</label>
                            <input type="email" placeholder="funcionario@aura.com">
                        </div>

                    </div>

                    <div class="row">

                        <div class="field">
                            <label>Telefone</label>
                            <input type="text" placeholder="(11) 99999-9999">
                        </div>

                        <div class="field">
                            <label>Cargo</label>

                            <select>
                                <option>Funcionário</option>
                                <option>Gerente</option>
                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="field">
                            <label>Cidade</label>
                            <input type="text">
                        </div>

                        <div class="field">
                            <label>Estado</label>
                            <input type="text">
                        </div>

                    </div>

                    <div class="field">
                        <label>País</label>
                        <input type="text" value="Brasil">
                    </div>

                    <div class="form-actions">

                        <a href="funcionarios.html">
                            <button class="btn-outline">
                                CANCELAR
                            </button>
                        </a>

                        <button class="btn-dark" onclick="alert('Funcionário cadastrado (simulação)')">
                            CADASTRAR
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Farm — Funcionários</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div class="app-layout">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">AURA</div>
      <div class="logo-sub">FARM</div>
    </div>

    <div class="nav">
      <div class="nav-section">
        <div class="nav-label">Geral</div>
        <a href="dashboard.html" class="nav-item">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Catálogo</div>
        <a href="produtos.html" class="nav-item">
          <i class="ti ti-shirt"></i> Produtos
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Vendas</div>
        <a href="vendas.html" class="nav-item">
          <i class="ti ti-shopping-cart"></i> Vendas
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Fornecedores</div>
        <a href="fornecedores.html" class="nav-item">
          <i class="ti ti-truck"></i> Fornecedores
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Funcionários</div>
        <a href="funcionarios.html" class="nav-item active">
          <i class="ti ti-users"></i> Funcionários
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">Conta</div>
        <a href="perfil.html" class="nav-item">
          <i class="ti ti-user"></i> Meu Perfil
        </a>
        <a href="login.html" class="nav-item">
          <i class="ti ti-logout"></i> Sair
        </a>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">--</div>
        <div>
          <div class="user-name">--</div>
          <div class="user-role">--</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="page-title">FUNCIONÁRIOS</div>
      <div class="breadcrumb">Cadastros / Funcionários</div>
    </div>

    <div class="content">
      <div class="toolbar">
        <div class="search-box">
          <i class="ti ti-search"></i>
          <input type="text" id="busca-funcionario" placeholder="Buscar funcionário...">
        </div>

        <a href="novo-funcionario.html">
          <button class="btn-new">+ NOVO FUNCIONÁRIO</button>
        </a>
      </div>

      <div id="erro-funcionarios" class="form-error"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>E-mail</th>
              <th>Cargo</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="tabela-funcionarios">
            <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="pag-info" id="pag-info-funcionarios"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/funcionarios.js"></script>
</body>
</html>

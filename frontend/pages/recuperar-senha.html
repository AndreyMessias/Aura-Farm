<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Aura Farm — Recuperar Senha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-left">

            <div class="logo-area">

                <div class="logo-text">
                    AURA
                </div>

                <div class="logo-sub">
                    FARM
                </div>

                <div class="logo-scratch"></div>

                <div class="logo-tagline">
                    Streetwear & Culture
                </div>

            </div>

        </div>

        <div class="auth-right">

            <div class="form-title">
                RECUPERAR SENHA
            </div>

            <div class="form-subtitle">
                Enviaremos um código para seu e-mail
            </div>

            <div class="field">

                <label>E-mail cadastrado</label>

                <input
                    type="email"
                    placeholder="seu@email.com">

            </div>

            <button
                class="btn-primary"
                onclick="alert('Código enviado (simulação). Verifique seu e-mail.')">

                ENVIAR CÓDIGO

            </button>

            <div
                class="login-link"
                style="margin-top:20px">

                <a href="login.html">
                    Voltar ao login
                </a>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
